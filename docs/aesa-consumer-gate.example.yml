# Example consumer workflow — copy into a product repo as
# .github/workflows/aesa-gate.yml after checking out the AESA kit.
#
# This file is documentation only (not executed by this repository's CI).

name: AESA Guard consumer gate (example)

on:
  pull_request:

jobs:
  aesa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout AESA kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: roham-amd/agent-ecosystem-security-audit
          path: .aesa-kit
          ref: main

      - name: AESA Guard
        uses: ./.aesa-kit/.github/actions/aesa-gate
        with:
          path: .
          mode: scan
          fail-on: high
          install-tools-from: .aesa-kit/tools
          baseline: .aesa/baseline.json
          baseline-inventory: .aesa/baseline-inventory.json
          output-dir: aesa-out

      # Optional: upload SARIF to code scanning if GITHUB_TOKEN permissions allow
      # - uses: github/codeql-action/upload-sarif@...
      #   with:
      #     sarif_file: aesa-out/findings.sarif.json
