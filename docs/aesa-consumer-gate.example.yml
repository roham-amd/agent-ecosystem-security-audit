# Example consumer workflow — copy into a product repo as
# .github/workflows/aesa-gate.yml
#
# This file is documentation only (not executed by this repository's CI).
#
# IMPORTANT: Pin an immutable AESA / authdiff release tag or commit SHA.
# Floating `ref: main` lets scanner changes silently alter your CI gate.

name: authdiff consumer gate (example)

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  authdiff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install authdiff
        run: pip install "aesa-tools==0.9.1"

      - name: authdiff Authority Diff
        uses: roham-amd/agent-ecosystem-security-audit/.github/actions/aesa-gate@v3.6.1
        with:
          path: .
          mode: scan
          # Leave fail-on empty on day one (advisory). Promote to high after baseline.
          trusted-policy: "true"
          authority-diff: "true"
          install-tools-from: path
          annotate: true
          # Do not set baseline: here unless the file exists on the base ref —
          # an empty/missing baseline disables the base-ref worktree diff step.
          output-dir: aesa-out
