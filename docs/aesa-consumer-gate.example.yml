# Single install recipe for consumers (PyPI + Action).
# Prefer this over a second kit checkout once aesa-tools is on PyPI.
name: authdiff
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  authdiff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install authdiff
        run: pip install "aesa-tools==0.10.0"

      - name: authdiff Authority Diff
        uses: roham-amd/agent-ecosystem-security-audit/.github/actions/aesa-gate@v3.7.0
        with:
          path: .
          mode: scan
          trusted-policy: "true"
          authority-diff: "true"
          # After `authdiff lock` + CODEOWNERS: locked: "true"
          locked: "false"
          install-tools-from: path
          annotate: true
          output-dir: aesa-out
