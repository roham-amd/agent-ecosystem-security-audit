name: AESA validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Install tooling
        working-directory: tools
        run: |
          python -m pip install -U pip
          python -m pip install -c constraints.txt -e ".[dev]"
          python -m pip check
      - name: Lint (Ruff)
        working-directory: tools
        run: aesa lint --check-format
      - name: Build and consistency checks
        run: aesa build all
      - name: Corpus harness
        run: aesa corpus run
      - name: Pytest
        working-directory: tools
        run: pytest -q ../tests
