name: AESA validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          version: "0.13.7"

      # Patch pin for CI reproducibility; .python-version keeps the minor (3.15).
      - name: Set up Python
        run: uv python install 3.15.2

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (Ruff)
        run: uv run --locked aesa lint --check-format

      - name: Type check (mypy)
        run: uv run --locked mypy aesa

      - name: Dependency audit
        run: uv run --locked pip-audit

      - name: Build and consistency checks
        working-directory: .
        run: uv run --directory tools --locked aesa build all

      - name: Corpus harness
        working-directory: .
        run: uv run --directory tools --locked aesa corpus run

      - name: Pytest
        run: uv run --locked pytest -q ../tests
