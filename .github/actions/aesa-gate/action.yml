name: AESA Guard
description: >-
  Passive agent-ecosystem Guard scan with optional baseline risk delta, trusted
  .aesa.yml policy loading, and PR annotations. Does not execute target
  application code or contact MCP endpoints.

inputs:
  path:
    description: Repository path to assess (relative to workspace)
    required: false
    default: "."
  profile:
    description: >-
      Legacy audit profile (quick|standard|deployment). Ignored when mode=scan
      (default). Kept for consumers migrating from aesa audit.
    required: false
    default: "quick"
  mode:
    description: scan (Guard rules) or audit (inventory handoff only)
    required: false
    default: "scan"
  baseline-inventory:
    description: Optional path to previous inventory.json for component-path diff
    required: false
    default: ""
  baseline:
    description: >-
      Optional path to previous baseline.json for risk delta.
      When empty, trusted/base policy.baseline is used if present.
    required: false
    default: ""
  fail-on:
    description: >-
      never | high | any. Leave empty to defer to trusted .aesa.yml (or never when
      no policy). Explicit values always override the policy file.
    required: false
    default: ""
  policy:
    description: >-
      Explicit path to .aesa.yml. When empty and trusted-policy=true on a PR,
      policy is loaded from the base ref. Otherwise only the scan-target file is
      used (never a parent outside the target).
    required: false
    default: ""
  no-policy:
    description: If true, ignore .aesa.yml even when present
    required: false
    default: "false"
  trusted-policy:
    description: >-
      If true on pull_request events, load .aesa.yml from the base ref so the PR
      author cannot weaken the gate by editing policy on the head ref. Also fails
      the job when the PR modifies .aesa.yml (authority-surface change).
    required: false
    default: "true"
  output-dir:
    description: Output directory for AESA artifacts
    required: false
    default: "aesa-out"
  install-tools-from:
    description: >-
      Path to AESA tools/ containing pyproject.toml. Empty (default) resolves to
      the Action-bundled tools directory when present, never the consumer
      workspace `tools/` by accident.
    required: false
    default: ""
  upload-sarif:
    description: If true, print path to findings.sarif.json for workflow upload
    required: false
    default: "true"
  annotate:
    description: If true (scan mode), emit GitHub Actions annotations from findings
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Resolve AESA tools directory
      id: tools
      shell: bash
      env:
        AESA_INSTALL_TOOLS_FROM: ${{ inputs.install-tools-from }}
        AESA_ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        # Prefer explicit input, then Action-bundled tools, and only then a
        # workspace-relative path. Never silently uv-sync a PR-controlled tools/.
        chosen="${AESA_INSTALL_TOOLS_FROM}"
        bundled="$(cd "$AESA_ACTION_PATH/../../.." && pwd)/tools"
        if [[ -z "${chosen}" ]]; then
          if [[ -f "${bundled}/pyproject.toml" ]]; then
            chosen="${bundled}"
            echo "Using Action-bundled AESA tools: ${chosen}"
          elif [[ -f tools/pyproject.toml ]]; then
            echo "::error::install-tools-from is empty and Action-bundled tools were not found. Refusing to default to workspace ./tools (PR-controlled code execution risk). Pass install-tools-from explicitly to a pinned AESA checkout."
            exit 1
          else
            echo "::error::Could not locate AESA tools/pyproject.toml"
            exit 1
          fi
        fi
        if [[ ! -f "${chosen}/pyproject.toml" ]]; then
          echo "::error::install-tools-from=${chosen} has no pyproject.toml"
          exit 1
        fi
        # Soft warning when tools resolve inside the default workspace without an
        # explicit .aesa-kit / action-bundled path.
        if [[ "${chosen}" == "tools" || "${chosen}" == "./tools" ]]; then
          echo "::warning::install-tools-from points at workspace tools/. Prefer a pinned AESA kit checkout or Action-bundled tools so PRs cannot supply the scanner."
        fi
        echo "dir=${chosen}" >> "$GITHUB_OUTPUT"

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true
        python-version: "3.15"

    - name: Install AESA tooling
      shell: bash
      working-directory: ${{ steps.tools.outputs.dir }}
      run: |
        set -euo pipefail
        uv sync --locked --no-dev
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

    - name: Flag .aesa.yml policy edits on pull requests
      if: inputs.mode == 'scan' && inputs.trusted-policy == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        AESA_PATH: ${{ inputs.path }}
        AESA_BASE_REF: ${{ github.base_ref }}
      run: |
        set -euo pipefail
        if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
          echo "Not a git work tree; skipping policy-edit check."
          exit 0
        fi
        base="origin/${AESA_BASE_REF}"
        if ! git rev-parse --verify "$base" >/dev/null 2>&1; then
          git fetch --no-tags --depth=1 origin "${AESA_BASE_REF}:${AESA_BASE_REF}" || true
          base="${AESA_BASE_REF}"
        fi
        if git diff --name-only "${base}...HEAD" | grep -E '(^|/)\.aesa\.yml$' >/dev/null; then
          echo "::error::PR modifies .aesa.yml. Policy changes are an authority-surface edit and must be reviewed on their own; the gate loads policy from the base ref when trusted-policy=true."
          exit 1
        fi
        echo "No .aesa.yml edits in this PR."

    - name: Resolve trusted policy path
      if: inputs.mode == 'scan'
      id: trusted_policy
      shell: bash
      env:
        AESA_PATH: ${{ inputs.path }}
        AESA_BASE_REF: ${{ github.base_ref }}
        AESA_NO_POLICY: ${{ inputs.no-policy }}
        AESA_TRUSTED: ${{ inputs.trusted-policy }}
        AESA_POLICY_INPUT: ${{ inputs.policy }}
        AESA_EVENT: ${{ github.event_name }}
      run: |
        set -euo pipefail
        echo "path=" >> "$GITHUB_OUTPUT"
        if [[ "${AESA_NO_POLICY}" == "true" || -n "${AESA_POLICY_INPUT}" ]]; then
          exit 0
        fi
        if [[ "${AESA_TRUSTED}" != "true" || "${AESA_EVENT}" != "pull_request" ]]; then
          exit 0
        fi
        out="${RUNNER_TEMP}/aesa-trusted-policy.yml"
        rm -f "$out"
        base="origin/${AESA_BASE_REF}"
        if ! git rev-parse --verify "$base" >/dev/null 2>&1; then
          base="${AESA_BASE_REF}"
        fi
        rel="${AESA_PATH%/}/.aesa.yml"
        rel="${rel#./}"
        if git show "${base}:${rel}" >"$out" 2>/dev/null; then
          echo "Loaded trusted policy from ${base}:${rel}"
          echo "path=${out}" >> "$GITHUB_OUTPUT"
        elif git show "${base}:.aesa.yml" >"$out" 2>/dev/null; then
          echo "Loaded trusted policy from ${base}:.aesa.yml"
          echo "path=${out}" >> "$GITHUB_OUTPUT"
        else
          echo "No base-ref .aesa.yml; scan will proceed without a trusted policy file."
        fi

    - name: Run AESA Guard scan (passive)
      if: inputs.mode == 'scan'
      shell: bash
      env:
        AESA_PATH: ${{ inputs.path }}
        AESA_OUTPUT_DIR: ${{ inputs.output-dir }}
        AESA_BASELINE: ${{ inputs.baseline }}
        AESA_FAIL_ON: ${{ inputs.fail-on }}
        AESA_POLICY: ${{ inputs.policy }}
        AESA_NO_POLICY: ${{ inputs.no-policy }}
        AESA_TRUSTED_POLICY: ${{ steps.trusted_policy.outputs.path }}
      run: |
        set -euo pipefail
        args=(scan "$AESA_PATH" -o "$AESA_OUTPUT_DIR")
        if [[ "${AESA_NO_POLICY}" == "true" ]]; then
          args+=(--no-policy)
        elif [[ -n "${AESA_POLICY}" ]]; then
          args+=(--policy "$AESA_POLICY")
        elif [[ -n "${AESA_TRUSTED_POLICY:-}" ]]; then
          args+=(--policy "$AESA_TRUSTED_POLICY")
          echo "Using trusted base-ref policy: $AESA_TRUSTED_POLICY"
        elif [[ -f "${AESA_PATH}/.aesa.yml" ]]; then
          args+=(--policy "${AESA_PATH}/.aesa.yml")
          echo "Auto-loaded policy: ${AESA_PATH}/.aesa.yml"
        fi
        if [[ -n "${AESA_FAIL_ON}" ]]; then
          args+=(--fail-on "$AESA_FAIL_ON")
        fi
        if [[ -n "${AESA_BASELINE}" ]]; then
          args+=(--baseline "$AESA_BASELINE")
        fi
        aesa "${args[@]}"

    - name: Annotate pull request findings
      if: inputs.mode == 'scan' && inputs.annotate == 'true'
      shell: bash
      env:
        AESA_OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        set -euo pipefail
        FINDINGS="$AESA_OUTPUT_DIR/findings.json"
        if [[ ! -f "$FINDINGS" ]]; then
          echo "No findings.json; skipping annotations."
          exit 0
        fi
        aesa annotate "$FINDINGS" --format github

    - name: Run AESA audit (legacy profile handoff)
      if: inputs.mode == 'audit'
      shell: bash
      env:
        AESA_PATH: ${{ inputs.path }}
        AESA_PROFILE: ${{ inputs.profile }}
        AESA_OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        set -euo pipefail
        aesa audit "$AESA_PATH" --profile "$AESA_PROFILE" -o "$AESA_OUTPUT_DIR"

    - name: Diff against baseline inventory (optional)
      if: inputs.baseline-inventory != ''
      shell: bash
      env:
        AESA_BASE_INVENTORY: ${{ inputs.baseline-inventory }}
        AESA_OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        set -euo pipefail
        BASE="$AESA_BASE_INVENTORY"
        CUR="$AESA_OUTPUT_DIR/inventory.json"
        OUT="$AESA_OUTPUT_DIR/inventory-delta.json"
        if [[ ! -f "$BASE" ]]; then
          echo "Baseline inventory not found; skipping diff."
          exit 0
        fi
        python -c "
        import json, pathlib, sys
        base = pathlib.Path(sys.argv[1])
        cur = pathlib.Path(sys.argv[2])
        out = pathlib.Path(sys.argv[3])
        b = {c.get('repository_path') or c.get('name') for c in json.loads(base.read_text(encoding='utf-8'))['components']}
        c = {c.get('repository_path') or c.get('name') for c in json.loads(cur.read_text(encoding='utf-8'))['components']}
        added = sorted(c - b)
        removed = sorted(b - c)
        print('## AESA inventory delta')
        print('Added (%d): %s' % (len(added), ', '.join(added) or '(none)'))
        print('Removed (%d): %s' % (len(removed), ', '.join(removed) or '(none)'))
        out.write_text(json.dumps({'added': added, 'removed': removed}, indent=2) + '\n', encoding='utf-8')
        " "$BASE" "$CUR" "$OUT"

    - name: Report incomplete coverage
      shell: bash
      env:
        AESA_OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        set -euo pipefail
        INV="$AESA_OUTPUT_DIR/inventory.json"
        if [[ ! -f "$INV" ]]; then
          echo "No inventory.json; skipping coverage report."
          exit 0
        fi
        python -c "
        import json, pathlib, sys
        inv = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
        cov = inv.get('coverage') or {}
        print('## AESA coverage')
        print('Deterministic discoveries:', cov.get('deterministically_discovered'))
        print('NOT VERIFIED:')
        for item in cov.get('not_verified') or []:
            print('-', item)
        print('Incomplete coverage must not be treated as a clean security result.')
        " "$INV"

    - name: Note SARIF path
      if: inputs.upload-sarif == 'true' && inputs.mode == 'scan'
      shell: bash
      env:
        AESA_OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        set -euo pipefail
        SARIF="$AESA_OUTPUT_DIR/findings.sarif.json"
        if [[ -f "$SARIF" ]]; then
          echo "SARIF ready for upload: $SARIF"
        else
          echo "SARIF not produced."
        fi

    - name: Upload AESA artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: aesa-out
        path: ${{ inputs.output-dir }}
