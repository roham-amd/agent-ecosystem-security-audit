[project]
name = "aesa-tools"
version = "0.4.0"
description = "AESA Guard tooling — scan, inventory, deterministic rules, validation, corpus, AgentSecBench"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
  "jsonschema>=4.26.0",
  "packaging>=26.3",
]

[project.scripts]
aesa = "aesa.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.18.0",
  "pip-audit>=2.9.0",
  "pytest>=9.2.0",
  "pytest-cov>=7.0.0",
  "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
addopts = [
  "--cov=aesa",
  "--cov-report=term-missing",
  "--cov-fail-under=0",
]

[tool.coverage.run]
branch = true
source = ["aesa"]

[tool.coverage.report]
omit = ["*/__main__.py"]

[tool.mypy]
python_version = "3.15"
packages = ["aesa"]
warn_unused_configs = true
warn_return_any = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true
pretty = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
  "jsonschema.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py315"
line-length = 100
src = ["aesa", "../tests"]
extend-exclude = [
  ".venv",
  "venv",
  "__pycache__",
  ".pytest_cache",
]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "UP",  # pyupgrade
  "SIM", # simplify
  "RUF", # ruff-specific
]
ignore = [
  "E501",  # formatter owns wrapping; keep long audit strings readable
]

[tool.ruff.lint.isort]
known-first-party = ["aesa"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["aesa*"]
