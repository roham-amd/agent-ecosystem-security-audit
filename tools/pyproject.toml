[project]
name = "aesa-tools"
version = "0.3.0"
description = "AESA tooling — audit profiles, inventory, validation, corpus, and benchmark harness"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
  "jsonschema==4.26.0",
  "packaging==26.3",
]

[project.scripts]
aesa = "aesa.cli:main"

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "ruff==0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py315"
line-length = 100
src = ["aesa", "../tests"]
extend-exclude = [
  ".venv",
  "venv",
  "__pycache__",
  ".pytest_cache",
]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "UP",  # pyupgrade
  "SIM", # simplify
  "RUF", # ruff-specific
]
ignore = [
  "E501",  # formatter owns wrapping; keep long audit strings readable
]

[tool.ruff.lint.isort]
known-first-party = ["aesa"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["aesa*"]
