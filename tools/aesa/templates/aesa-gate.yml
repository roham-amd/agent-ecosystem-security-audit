# Generated by `aesa init`. Pin AESA by tag or SHA — do not float on main.
# Day-one default is advisory (no fail-on). Promote fail-on after precision holds.
name: AESA Guard
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  aesa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout AESA kit
        uses: actions/checkout@v4
        with:
          repository: roham-amd/agent-ecosystem-security-audit
          path: .aesa-kit
          ref: v3.6.0

      - name: AESA Guard
        uses: ./.aesa-kit/.github/actions/aesa-gate
        with:
          path: .
          mode: scan
          # Leave fail-on empty to honor advisory .aesa.yml (never).
          trusted-policy: "true"
          authority-diff: "true"
          install-tools-from: .aesa-kit/tools
          annotate: true
          output-dir: aesa-out
