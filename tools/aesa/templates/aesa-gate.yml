# Generated by `aesa init-gate`. Pin AESA by tag or SHA — do not float on main.
name: AESA Guard
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  aesa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout AESA kit
        uses: actions/checkout@v4
        with:
          repository: roham-amd/agent-ecosystem-security-audit
          path: .aesa-kit
          ref: v3.5.0

      - name: AESA Guard
        uses: ./.aesa-kit/.github/actions/aesa-gate
        with:
          path: .
          mode: scan
          fail-on: high
          trusted-policy: "true"
          install-tools-from: .aesa-kit/tools
          annotate: true
          output-dir: aesa-out
