# Generated by `authdiff ci init` / `aesa init`.
# Day-one default is advisory (no fail-on). Promote fail-on after precision holds.
name: authdiff
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  authdiff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install authdiff
        run: pip install "aesa-tools==0.9.1"

      - name: authdiff Authority Diff
        uses: roham-amd/agent-ecosystem-security-audit/.github/actions/aesa-gate@v3.6.1
        with:
          path: .
          mode: scan
          # Leave fail-on empty to honor advisory .aesa.yml (never).
          trusted-policy: "true"
          authority-diff: "true"
          install-tools-from: path
          annotate: true
          output-dir: aesa-out
