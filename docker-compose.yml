# Local AESA container — kit baked into the image; mount a target repo at /work.
#
#   docker compose build
#   TARGET=/path/to/repo docker compose run --rm aesa scan /work -o /tmp/aesa-out
#   docker compose run --rm aesa doctor --home /work
#
# Prefer writing artifacts outside the mounted target (e.g. /tmp/aesa-out).

services:
  aesa:
    build:
      context: .
      dockerfile: Dockerfile
    image: aesa:local
    working_dir: /work
    volumes:
      - ${TARGET:-.}:/work
    # Drop privileges already handled by USER in the Dockerfile.
